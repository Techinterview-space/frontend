<div class="">
  <div class="h4 mb-3">Грейды респондентов</div>

  <div class="mb-3" *ngIf="barsForLocal.length > 0">
    <div class="mb-3">
      <span>Казахстанские компании (тенге)</span>
      <span class="ms-2">{{ totalCountLocal }} анкет</span>
    </div>
    <div class="progress" (click)="toggleCountAndPercent()">
      <div
        *ngFor="let item of barsForLocal"
        class="progress-bar"
        role="progressbar"
        [ngStyle]="{ width: item.width + '%', 'background-color': item.color }"
        [attr.aria-label]="item.label + ' ' + item.value"
        aria-valuemin="0"
        aria-valuemax="100"
      >
        <strong
          *ngIf="item.showLabel"
          title="{{ item.label }} - {{ item.value }}"
          [ngStyle]="{ color: item.textColor }"
          >{{ item.value }}</strong
        >
      </div>
    </div>
  </div>

  <div class="mb-3" *ngIf="barsForRemote.length > 0">
    <div class="mb-3">
      <span>Иностранные компании (тенге)</span>
      <span class="ms-2">{{ totalCountRemote }} анкет</span>
    </div>
    <div class="progress" (click)="toggleCountAndPercent()">
      <div
        *ngFor="let item of barsForRemote"
        class="progress-bar"
        role="progressbar"
        [ngStyle]="{ width: item.width + '%', 'background-color': item.color }"
        [attr.aria-label]="item.label + ' ' + item.value"
        aria-valuemin="0"
        aria-valuemax="100"
      >
        <strong
          *ngIf="item.showLabel"
          title="{{ item.label }} - {{ item.value }}"
          [ngStyle]="{ color: item.textColor }"
          >{{ item.value }}</strong
        >
      </div>
    </div>
  </div>

  <div class="">
    <span>Значения цветов</span>
    <span
      *ngFor="let item of legendItems"
      class="grade-legend-chip ms-2"
      [ngStyle]="{ 'background-color': item.bg, color: item.on }"
      >{{ item.label }}</span
    >
  </div>
</div>
